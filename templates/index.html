<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda Estética</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
        <h1 class="text-center mb-4">💆 Agenda da Estética</h1>
        <div class="card shadow-lg p-4">
            <h4 class="mb-3">Escolha um dia da semana:</h4>
            <div class="list-group">
                {% for dia in dias %}
                    <a href="/agenda/{{ dia }}" class="list-group-item list-group-item-action">
                        {{ dia }}
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>
<div class="card shadow-lg p-4 mt-4">
    <h4 class="mb-3">Buscar cliente:</h4>
    <form action="/buscar" method="post" class="d-flex gap-2">
        <input type="text" name="nome" class="form-control" placeholder="Digite o nome do cliente" required>
        <button type="submit" class="btn btn-primary">Buscar</button>
    </form>
</div> 
</body>
</html>
