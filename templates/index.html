<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda Estética</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Agenda da Estética</h1>
    <ul>
        {% for dia in dias %}
        <li><a href="{{ url_for('agenda', dia=dia) }}">{{ dia }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
