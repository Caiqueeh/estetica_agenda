<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda - {{ dia }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Agenda - {{ dia }}</h1>

        <!-- Tabela de horários -->
        <table class="table">
            <tr>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Ações</th>
            </tr>
            {% for h in horarios %}
            <tr>
                <td>{{ h[1] }}</td>
                <td>{{ h[2] if h[2] else 'Livre' }}</td>
                <td>
                    {% if not h[2] %}
                    <form action="{{ url_for('marcar', id_horario=h[0]) }}" method="post" style="display:flex; gap:5px; justify-content:center;">
                        <input type="text" name="cliente" placeholder="Nome do cliente" required>
                        <button type="submit">Marcar</button>
                    </form>
                    {% else %}
                    <a href="{{ url_for('cancelar', id_horario=h[0]) }}"><button>Cancelar</button></a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>

        <!-- Botão Voltar -->
<div style="margin-top:20px;">
    <a href="{{ url_for('index') }}">
        <button class="btn">Voltar</button>
    </a>
</div>
    </div>
</body>
</html>
