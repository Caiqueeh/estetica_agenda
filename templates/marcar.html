<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agenda - {{ dia }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">📅 Agenda de {{ dia }}</h1>

<div class="d-flex justify-content-between mb-3">
    <div>
        <a href="/agenda/{{ dia }}?filtro=todos" class="btn btn-outline-dark btn-sm {% if filtro=='todos' %}active{% endif %}">Todos</a>
        <a href="/agenda/{{ dia }}?filtro=livres" class="btn btn-outline-success btn-sm {% if filtro=='livres' %}active{% endif %}">Somente livres</a>
    </div>
    <a href="/" class="btn btn-secondary btn-sm">⬅️ Voltar</a>
</div>
        

<div class="card shadow-lg">
            <div class="card-body">
                <table class="table table-bordered table-striped text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Hora</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for h in horarios %}
                        <tr>
                            <td><strong>{{ h[1] }}</strong></td>
                            <td>
                                {% if h[2] %}
                                    <span class="badge bg-danger">Reservado para {{ h[2] }}</span>
                                {% else %}
                                    <span class="badge bg-success">Livre</span>
                                {% endif %}
                            </td>
                            <td>
                                {% if h[2] %}
                                    <a href="/cancelar/{{ h[0] }}" class="btn btn-sm btn-outline-danger">Cancelar</a>
                                {% else %}
                                    <form action="/marcar/{{ h[0] }}" method="post" class="d-flex gap-2 justify-content-center">
                                        <input type="text" name="cliente" placeholder="Nome do cliente" required class="form-control form-control-sm w-50">
                                        <button type="submit" class="btn btn-sm btn-primary">Marcar</button>
                                    </form>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <div class="text-center mt-3">
                    <a href="/" class="btn btn-secondary">⬅️ Voltar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
