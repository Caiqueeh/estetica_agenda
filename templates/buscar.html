<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">🔍 Resultados da busca: "{{ nome }}"</h1>

        <div class="card shadow-lg">
            <div class="card-body">
                {% if resultados %}
                    <table class="table table-bordered text-center align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Dia</th>
                                <th>Hora</th>
                                <th>Cliente</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for r in resultados %}
                            <tr>
                                <td>{{ r[0] }}</td>
                                <td>{{ r[1] }}</td>
                                <td>{{ r[2] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                {% else %}
                    <p class="text-center text-muted">Nenhum horário encontrado para esse cliente.</p>
                {% endif %}

                <div class="text-center mt-3">
                    <a href="/" class="btn btn-secondary">⬅️ Voltar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
